name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project and Build
        run: |
          # Proje kök dizinini veya alt klasörleri otomatik tespit edip derler
          if [ -f "settings.gradle" ]; then
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            TARGET_DIR=$(find . -name "settings.gradle" -maxdepth 3 -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "settings.gradle bulunamadı!"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
